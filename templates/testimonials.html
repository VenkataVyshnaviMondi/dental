<section id="testimonials" class="testimonials-section" aria-labelledby="testimonials-heading" aria-roledescription="carousel">
  <div class="testimonials-heading"><h2 id="testimonials-heading">Your comfort. In their words.</h2><p>A little reassurance before your first visit.</p></div>
  <div class="testimonial-stage">
    <article class="testimonial-card" aria-roledescription="slide" aria-label="Review 1 of 3">
      <span class="testimonial-quote-mark" aria-hidden="true">“</span>
      <blockquote><p id="testimonial-quote">Everything was explained clearly, and I felt comfortable throughout my visit.</p></blockquote>
      <div class="testimonial-portrait" aria-hidden="true"></div>
      <p class="testimonial-attribution">Patient name <span>· Sample review</span></p>
    </article>
    <div class="testimonial-progress" aria-hidden="true"><span></span></div>
    <div class="testimonial-controls">
      <button class="testimonial-control" id="testimonial-prev" type="button" aria-label="Previous testimonial"><svg aria-hidden="true"><use href="#chevron"/></svg></button>
      <div class="testimonial-dots" role="group" aria-label="Choose a testimonial"><button type="button" aria-label="Show testimonial 1" aria-current="true" data-review="0"><span></span></button><button type="button" aria-label="Show testimonial 2" data-review="1"><span></span></button><button type="button" aria-label="Show testimonial 3" data-review="2"><span></span></button></div>
      <button class="testimonial-control" id="testimonial-next" type="button" aria-label="Next testimonial"><svg aria-hidden="true"><use href="#chevron"/></svg></button>
      <button class="testimonial-control" id="testimonial-pause" type="button" aria-label="Pause testimonial slideshow"><svg aria-hidden="true" viewBox="0 0 24 24"><path class="testimonial-pause-icon" d="M9 6v12M15 6v12"/><path class="testimonial-play-icon" d="m9 5 10 7-10 7Z"/></svg></button>
    </div>
  </div>

  <p class="testimonial-announcement sr-only" role="status"></p>
</section>
